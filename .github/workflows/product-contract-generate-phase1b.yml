name: Generate Phase 1b contract artifacts

on:
  push:
    branches:
      - feature/product-contract-phase1b
    paths:
      - "contract/**"
      - ".github/workflows/product-contract-generate-phase1b.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-contract-phase1b

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate canonical artifacts
        run: python contract/tools/contract_tool.py generate

      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- contract/generated; then
            echo "Generated artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract/generated
          git commit -m "Regenerate Phase 1b Product Contract artifacts"
          git push origin HEAD:feature/product-contract-phase1b
