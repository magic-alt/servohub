name: Fix Phase 1b generated header comments

on:
  push:
    branches:
      - feature/product-contract-phase1b
    paths:
      - ".github/workflows/product-contract-fix-generated-comments.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-contract-phase1b

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix generator comment and regenerate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('contract/tools/generators.py')
          text = path.read_text(encoding='utf-8')
          old = '* Source: contract/schema/*'
          new = '* Source: contract/schema bundle'
          if old not in text:
              raise SystemExit('expected generator comment marker not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python contract/tools/contract_tool.py generate
          python contract/tools/contract_tool.py all

      - name: Commit generator and artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract/tools/generators.py contract/generated
          git commit -m "Fix generated Product Contract header comments"
          git push origin HEAD:feature/product-contract-phase1b
